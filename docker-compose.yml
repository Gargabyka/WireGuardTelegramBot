services:
  wireguard-bot:
    build: .
    container_name: wireguard-bot
    restart: unless-stopped

    user: "0:0"

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Telegram__Token: "<TOKEN_PLACEHOLDER>"
      Telegram__AdminIds__0: "<ADMIN_ID_PLACEHOLDER>"
      WireGuardApi__ApiUrl: "http://<HOST:PORT>/"
      WireGuardApi__ApiPassword: "<PASSWORD_PLACEHOLDER>"
      ConnectionStrings__Sqlite: "Data Source=/data/wireguard_bot.db"
      WireGuardDocker__Enabled: "true"
      WireGuardDocker__DockerSocketPath: "/var/run/docker.sock"
      WireGuardDocker__TargetContainerName: "wg-easy"

    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/wireguard:/etc/wireguard:rw
