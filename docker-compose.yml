services:
  wireguard-bot:
    build: .
    network: host
    container_name: wireguard-bot
    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - ./.env

    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/wireguard:/etc/wireguard:rw

    environment:
      ASPNETCORE_ENVIRONMENT: "Production"